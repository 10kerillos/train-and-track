name: train_and_track
description: A new Flutter project for fitness and nutrition tracking.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Adjusted to a more current SDK range

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0 # Check for latest version
  firebase_auth: ^4.17.8 # Check for latest version
  google_sign_in: ^6.2.1 # Check for latest version

  # State Management
  provider: ^6.1.2 # Check for latest version

  # Local Storage
  shared_preferences: ^2.2.2 # Check for latest version

  # HTTP client - useful for API calls if needed later
  # http: ^1.2.0 # Check for latest version

  # For SVG icons (optional, but good to have)
  # flutter_svg: ^2.0.9 # Check for latest version

  # For date/time formatting
  intl: ^0.19.0 # Check for latest version

  # Cupertino icons (iOS style icons)
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0 # Check for latest version

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro-Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
